<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekly audio recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2FE0}a:hover{color:#3218B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF0F4; color: #15131F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #4D4A5C">WEEKLY RECAP</div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Week 1 in 4 minutes</h1>
  </div>

  <div style="margin: 16px 20px 0; background: #15131F; color: #F5F4FA; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <button type="button" aria-label="Play recap" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: {{accent}}; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg>
      </button>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 700">5 ideas from 6 lessons</div>
        <div style="font-size: 13px; color: #CFCBE0">4:10 · from 4 books</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{ideas}}" as="i" hint-placeholder-count="5">
        <div style="display: flex; gap: 12px">
          <div style="font-size: 12px; color: #CFCBE0; width: 34px; padding-top: 2px; font-variant-numeric: tabular-nums">{{i.t}}</div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 14px; font-weight: 600; line-height: 1.35">{{i.idea}}</div>
            <div style="font-size: 12px; color: #B8B3CC">{{i.src}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 14px 20px 0; background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{accent}}">QUICK CHECK · 1 OF 3</div>
      <div style="font-size: 12px; color: #4D4A5C">due for review</div>
    </div>
    <div style="font-size: 16px; font-weight: 700; line-height: 1.4">Per Housel, what usually builds wealth more reliably?</div>
    <button type="button" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D3D6DE; background: #FFFFFF; font: inherit; font-size: 15px; color: #15131F; text-align: left; cursor: pointer">A high salary</button>
    <button type="button" aria-pressed="true" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #0F7A5C; background: #E7F6F0; font: inherit; font-size: 15px; font-weight: 600; color: #0B5C45; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between">A high savings rate, given time
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5C45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    </button>
    <button type="button" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D3D6DE; background: #FFFFFF; font: inherit; font-size: 15px; color: #15131F; text-align: left; cursor: pointer">Picking the right stocks</button>
  </div>

  <div style="margin-top: auto; padding: 14px 20px 24px">
    <button type="button" style="width: 100%; height: 54px; border-radius: 27px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Ask the tutor about my mistakes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#0F7A5C","#C2410C","#1D3FD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ideas = [
      { t: '0:00', idea: 'Money decisions follow your own history', src: 'Housel, Ch. 1' },
      { t: '0:50', idea: 'Track spending for 30 days before judging it', src: 'Robin & Dominguez, Step 2' },
      { t: '1:40', idea: 'Decide what “enough” means for you', src: 'Housel, Ch. 3' },
      { t: '2:30', idea: 'Spend big on what you love, cut the rest', src: 'Sethi, Ch. 4' },
      { t: '3:20', idea: 'Savings rate beats income', src: 'Housel, Ch. 10 · Stanley & Danko' }
    ];
    return { accent: this.props.accent ?? '#5B3DF5', ideas };
  }
}
</script>
</body>
</html>
