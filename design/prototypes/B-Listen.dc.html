<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listening mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6F432}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0B10; color: #F4F4F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; padding: 14px 12px 0">
    <a href="B-Today.dc.html" aria-label="Close listening mode" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F4F6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
    <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #A3A3B2">LISTENING MODE</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; gap: 8px">
    <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: {{accent}}; color: #0B0B10; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Commute · 40 min</button>
    <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #34344A; background: transparent; color: #F4F4F6; font: inherit; font-size: 14px; cursor: pointer">Walk · 20</button>
    <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #34344A; background: transparent; color: #F4F4F6; font: inherit; font-size: 14px; cursor: pointer">Custom</button>
  </div>

  <div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: {{accent}}; font-weight: 600">NOW · LESSON 7 OF 21</div>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; line-height: 1.02">Pay yourself first</h1>
    <div style="margin-top: 14px; height: 6px; background: #2A2A36; border-radius: 3px; overflow: hidden"><div style="width: 35%; height: 100%; background: {{accent}}"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3A3B2"><span>4:12</span><span>−7:54</span></div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Previous" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: #1C1C26; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#F4F4F6" aria-hidden="true"><path d="M18 5v14L8 12z"/><rect x="5" y="5" width="2.5" height="14" rx="1"/></svg>
    </button>
    <button type="button" aria-label="Pause" style="width: 112px; height: 112px; border-radius: 50%; border: none; background: {{accent}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#0B0B10" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button type="button" aria-label="Next" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: #1C1C26; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#F4F4F6" aria-hidden="true"><path d="M6 5v14l10-7z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg>
    </button>
  </div>

  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 13px; font-weight: 600; color: #A3A3B2">Up next</div>
      <div style="font-size: 13px; color: #A3A3B2">ends ≈ 8:52 AM</div>
    </div>
    <sc-for list="{{queue}}" as="q" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #17171F">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 6px; background: {{q.tagBg}}; color: {{q.tagFg}}; white-space: nowrap">{{q.tag}}</div>
        <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500">{{q.title}}</div>
        <div style="font-size: 13px; color: #A3A3B2; white-space: nowrap">{{q.min}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 20px 24px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #A3A3B2">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3B2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
    Hands-free: say “Hey, explain that” to pause and ask
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#7DD3FC","#FDBA74","#F9A8D4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C6F432';
    const tag = (kind) => ({
      LESSON: { tagBg: '#2A2A36', tagFg: '#F4F4F6' },
      RECAP: { tagBg: accent, tagFg: '#0B0B10' },
      TUTOR: { tagBg: '#7DD3FC', tagFg: '#0B0B10' }
    })[kind];
    const queue = [
      { tag: 'LESSON', title: 'Emergency fund: how big?', min: '11 min' },
      { tag: 'RECAP', title: 'Week 1 in 4 minutes', min: '4 min' },
      { tag: 'LESSON', title: 'Snowball vs. avalanche', min: '13 min' },
      { tag: 'TUTOR', title: 'Quick voice check-in', min: '2 min' }
    ].map(q => Object.assign(q, tag(q.tag)));
    return { accent, queue };
  }
}
</script>
</body>
</html>
