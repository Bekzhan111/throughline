<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a topic — build a program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3FD6}a:hover{color:#132C99}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F6F8; color: #0E1726; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3D4757">STEP 1 OF 2</div>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.2">What do you want to get better at?</h1>
    <p style="margin: 0; font-size: 15px; color: #3D4757; line-height: 1.5">Pick a topic, not a book. We build the program from the best books on it.</p>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{topics}}" as="t" hint-placeholder-count="8">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; font-weight: 600">Time per day</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{mins}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 44px; border-radius: 10px; border: {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{m.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin: 20px 20px 0; background: #FFFFFF; border: 1px solid #E2E5EB; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{accent}}">YOUR PROGRAM PREVIEW</div>
    <div style="font-size: 20px; font-weight: 700; line-height: 1.25">{{prog.name}}</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3D4757">{{prog.days}} lessons · {{min}} min/day · {{prog.books}} books</div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{prog.sample}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; align-items: center">
          <div style="width: 6px; height: 28px; border-radius: 2px; background: {{accent}}"></div>
          <div style="font-size: 14px; line-height: 1.35"><span style="font-weight: 600">{{b.t}}</span><span style="color: #4F5968"> — {{b.a}}</span></div>
        </div>
      </sc-for>
      <div style="font-size: 13px; color: #4F5968">+ {{prog.more}} more sources</div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 24px">
    <button type="button" style="width: 100%; height: 54px; border-radius: 12px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Build my program</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D3FD6","options":["#1D3FD6","#0F7A5C","#B4381F","#5B21B6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { topic: 'fin', min: 15 }; }
  renderVals() {
    const accent = this.props.accent ?? '#1D3FD6';
    const P = {
      fin: { label: 'Personal finance', name: 'Personal Finance: from paycheck to plan', days: 21, books: 8, more: 5, sample: [{ t: 'The Psychology of Money', a: 'Morgan Housel' }, { t: 'I Will Teach You to Be Rich', a: 'Ramit Sethi' }, { t: 'The Simple Path to Wealth', a: 'JL Collins' }] },
      inv: { label: 'Investing basics', name: 'Investing basics for busy people', days: 14, books: 6, more: 3, sample: [{ t: 'The Little Book of Common Sense Investing', a: 'John C. Bogle' }, { t: 'A Random Walk Down Wall Street', a: 'Burton Malkiel' }, { t: 'The Simple Path to Wealth', a: 'JL Collins' }] },
      neg: { label: 'Negotiation', name: 'Negotiate your salary and beyond', days: 14, books: 5, more: 2, sample: [{ t: 'Never Split the Difference', a: 'Chris Voss' }, { t: 'Getting to Yes', a: 'Fisher & Ury' }, { t: 'Bargaining for Advantage', a: 'G. Richard Shell' }] },
      hab: { label: 'Habits', name: 'Habits that actually stick', days: 14, books: 6, more: 3, sample: [{ t: 'Atomic Habits', a: 'James Clear' }, { t: 'The Power of Habit', a: 'Charles Duhigg' }, { t: 'Tiny Habits', a: 'BJ Fogg' }] },
      pro: { label: 'Productivity', name: 'Focus and time: doing what matters', days: 21, books: 7, more: 4, sample: [{ t: 'Deep Work', a: 'Cal Newport' }, { t: 'Getting Things Done', a: 'David Allen' }, { t: 'Four Thousand Weeks', a: 'Oliver Burkeman' }] },
      lead: { label: 'First-time manager', name: 'Your first year as a manager', days: 21, books: 7, more: 4, sample: [{ t: 'The Making of a Manager', a: 'Julie Zhuo' }, { t: 'Radical Candor', a: 'Kim Scott' }, { t: 'Turn the Ship Around!', a: 'L. David Marquet' }] },
      com: { label: 'Hard conversations', name: 'Hard conversations at work and home', days: 14, books: 5, more: 2, sample: [{ t: 'Crucial Conversations', a: 'Patterson et al.' }, { t: 'Supercommunicators', a: 'Charles Duhigg' }, { t: 'Nonviolent Communication', a: 'Marshall Rosenberg' }] },
      slp: { label: 'Better sleep', name: 'Sleep better in 2 weeks', days: 14, books: 5, more: 2, sample: [{ t: 'Why We Sleep', a: 'Matthew Walker' }, { t: 'Say Good Night to Insomnia', a: 'Gregg D. Jacobs' }, { t: 'The Sleep Revolution', a: 'Arianna Huffington' }] }
    };
    const on = (sel) => sel
      ? { bg: '#0E1726', fg: '#FFFFFF', border: '1px solid #0E1726', pressed: 'true' }
      : { bg: '#FFFFFF', fg: '#0E1726', border: '1px solid #C9CFDA', pressed: 'false' };
    const topics = Object.keys(P).map(k => Object.assign({ label: P[k].label, pick: () => this.setState({ topic: k }) }, on(this.state.topic === k)));
    const mins = [10, 15, 20].map(m => Object.assign({ label: m + ' min', pick: () => this.setState({ min: m }) }, on(this.state.min === m)));
    return { accent, topics, mins, prog: P[this.state.topic], min: this.state.min };
  }
}
</script>
</body>
</html>
