<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's audio lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6F432}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0B10; color: #F4F4F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 22px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; color: #A3A3B2">Good evening, Jordan</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">Personal Finance</div>
    </div>
    <div style="padding: 8px 12px; border-radius: 20px; background: #1C1C26; font-size: 13px; font-weight: 600; color: {{accent}}">Day 7 / 21</div>
  </div>

  <div style="margin: 18px 20px 0; border-radius: 20px; background: #17171F; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 96px; display: flex; align-items: center; gap: 3px" aria-hidden="true">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="48">
        <div style="flex: 1; height: {{b.h}}px; border-radius: 2px; background: {{b.c}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{accent}}">TODAY'S EPISODE</div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.1">Pay yourself first</h1>
      <div style="font-size: 14px; color: #A3A3B2">12 min · ideas from Sethi, Housel, Stanley &amp; Danko</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 68px; height: 68px; border-radius: 50%; border: none; background: {{accent}}; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#0B0B10" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#0B0B10" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg>
        </sc-if>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 4px; background: #2A2A36; border-radius: 2px; overflow: hidden"><div style="width: {{progress}}; height: 100%; background: {{accent}}"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A3A3B2"><span>{{time}}</span><span>12:06</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; font-weight: 600; color: #A3A3B2; margin-bottom: 6px">In this episode</div>
    <sc-for list="{{chapters}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 44px; border-bottom: 1px solid #1F1F2A">
        <div style="width: 44px; font-size: 13px; color: #A3A3B2; font-variant-numeric: tabular-nums">{{c.t}}</div>
        <div style="flex: 1; font-size: 15px; color: {{c.fg}}; font-weight: {{c.w}}">{{c.title}}</div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 20px 0">
    <a href="B-Tutor.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #1C1C26; text-decoration: none; color: #F4F4F6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 500">After listening: 3-minute voice check-in</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3B2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>

  <nav style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #1F1F2A; padding: 8px 8px 18px">
    <a href="B-Today.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>Today
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; text-decoration: none; color: #A3A3B2; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Program
    </a>
    <a href="B-Listen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; text-decoration: none; color: #A3A3B2; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Listen
    </a>
    <a href="B-Tutor.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; text-decoration: none; color: #A3A3B2; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Tutor
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F432","options":["#C6F432","#7DD3FC","#FDBA74","#F9A8D4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#C6F432';
    const playing = this.state.playing;
    const played = 17;
    const bars = Array.from({ length: 48 }, (_, i) => {
      const h = 18 + Math.round(70 * Math.abs(Math.sin(i * 0.55) * Math.cos(i * 0.21)));
      return { h, c: i < played ? accent : '#34344A' };
    });
    const chapters = [
      { t: '0:00', title: 'The leftover trap' },
      { t: '3:40', title: 'Flip the order', cur: true },
      { t: '7:10', title: 'Automate it in 15 minutes' },
      { t: '10:30', title: 'Your one action for today' }
    ].map(c => Object.assign(c, { fg: c.cur ? accent : '#F4F4F6', w: c.cur ? 600 : 400 }));
    return {
      accent, bars, chapters,
      playing, paused: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      progress: '35%', time: '4:12',
      toggle: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
